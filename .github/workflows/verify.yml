on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      first_season:
        description: "Earliest season of training history to join against"
        required: false
        default: "2023"
      draft_group:
        description: "Draft group id (blank = busiest of the chosen type)"
        required: false
        default: ""
      game_type:
        description: "Classic or Showdown"
        required: false
        default: "Classic"
