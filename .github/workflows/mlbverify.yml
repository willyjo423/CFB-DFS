name: MLB verify

# Every unknown about baseball, answered in one run rather than five:
# does the schedule answer, what does a box score actually contain, do the
# DraftKings ids actually JOIN (not merely exist), and do both scoring
# systems reproduce DraftKings' own published points per game.
#
# 700 games is not arbitrary. The scoring check compares our per-player
# average against DraftKings' season average, and at 8 games a perfectly
# scored hitter still shows an error near 2 points from variance alone.
# 700 games gives regulars ~40 appearances, which is enough for a mean to
# mean something. At 120 it measured noise and the guard refused to report.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      start:
        description: "Window start (blank = June 1)"
        required: false
        default: ""
      end:
        description: "Window end (blank = Sep 15)"
        required: false
        default: ""
      games:
        description: "How many finished games to pull"
        required: false
        default: "700"
      min_games:
        description: "Minimum games per player for the scoring comparison"
        required: false
        default: "25"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Verify
        run: |
          ARGS="--season ${{ inputs.season }}"
          ARGS="$ARGS --games ${{ inputs.games }}"
          ARGS="$ARGS --min-games ${{ inputs.min_games }}"
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          echo "EFFECTIVE ARGS: $ARGS"
          python mlb_verify.py $ARGS 2>&1 | tee mlbverify.txt

      - name: Put it on the run page
        if: always()
        run: |
          {
