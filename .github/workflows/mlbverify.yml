name: MLB verify

# Every unknown about baseball in one run: does the schedule answer, what
# does a box score actually contain, do the DraftKings ids actually JOIN
# (not merely exist), and do BOTH scoring systems reproduce DraftKings' own
# published points per game.
#
# The two thresholds are separate because the two populations are. A hitter
# plays most days; a starting pitcher appears every fifth. One threshold for
# both silently excluded every pitcher from a check that then printed PASS.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      start:
        description: "Window start (blank = June 1)"
        required: false
        default: ""
      end:
        description: "Window end (blank = Sep 15)"
        required: false
        default: ""
      games:
        description: "How many finished games to pull"
        required: false
        default: "700"
      min_games:
        description: "Minimum games for a HITTER in the scoring check"
        required: false
        default: "25"
      pitcher_min:
        description: "Minimum appearances for a PITCHER in the scoring check"
        required: false
        default: "8"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Verify
        run: |
          ARGS="--season ${{ inputs.season }}"
          ARGS="$ARGS --games ${{ inputs.games }}"
          ARGS="$ARGS --min-games ${{ inputs.min_games }}"
          ARGS="$ARGS --pitcher-min ${{ inputs.pitcher_min }}"
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          echo "EFFECTIVE ARGS: $ARGS"
          python mlb_verify.py $ARGS 2>&1 | tee mlbverify.txt

      - name: Put it on the run page
        if: always()
        run: |
          echo '## MLB verify' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 60000 mlbverify.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-verify
          path: mlbverify.txt
          retention-days: 30
          if-no-files-found: warn
