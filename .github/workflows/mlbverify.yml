name: MLB verify

# Every unknown about baseball, answered in one run rather than five:
# does the schedule answer, what does a box score actually contain, does
# DraftKings carry the MLB player id, and do both scoring systems reproduce
# DraftKings' own published points per game.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        required: false
        default: "2026"
      start:
        description: "Window start (blank = Aug 15)"
        required: false
        default: ""
      end:
        description: "Window end (blank = Sep 15)"
        required: false
        default: ""
      games:
        description: "How many finished games to pull"
        required: false
        default: "120"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Verify
        run: |
          ARGS="--season ${{ inputs.season }} --games ${{ inputs.games }}"
          if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          echo "EFFECTIVE ARGS: $ARGS"
          python mlb_verify.py $ARGS 2>&1 | tee mlbverify.txt

      - name: Put it on the run page
        if: always()
        run: |
          {
            echo '## MLB verify'
            echo '```'
            tail -c 60000 mlbverify.txt || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-verify
          path: mlbverify.txt
          retention-days: 30
          if-no-files-found: warn
