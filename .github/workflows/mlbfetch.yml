name: MLB fetch history

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to fetch, space separated"
        default: "2025 2026"
      refresh:
        description: "Seasons to re-fetch even if already cached"
        default: ""
      limit:
        description: "Cap games per season (0 = all). Use 50 for a smoke test."
        default: "0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make the engine importable
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- engine/ ---"
          ls -la engine 2>/dev/null || echo "(no engine directory)"

          ENGINE_FILES="__init__.py spec.py frame.py features.py model.py grade.py factors.py cache.py simulate.py ownership.py optimise.py"

          # A root copy of an engine file is a NEW UPLOAD, and it wins.
          #
          # The steady state of this repo has no engine files in the root -
          # they were cleaned out once and stay out. So anything that appears
          # there afterwards can only have come from GitHub's web uploader,
          # which drops files at the top level, and is therefore newer than
          # whatever engine/ holds.
          #
          # An earlier version of this step assumed the opposite: where both
          # existed it kept engine/ and deleted the root copy. That silently
          # threw away a rewritten grade.py and features.py, committed the
          # deletion, and then ran the tests against the stale code they were
          # meant to replace. Resolving a conflict is fine; resolving it in
          # the wrong direction without saying so is not.
          mkdir -p engine
          for f in $ENGINE_FILES; do
            if [ -f "$f" ]; then
              if [ -f "engine/$f" ] && ! cmp -s "$f" "engine/$f"; then
                echo "  installing NEWER uploaded $f over engine/$f"
              else
                echo "  moving $f -> engine/$f"
              fi
              mv -f "$f" "engine/$f"
            fi
          done

          if [ ! -f engine/__init__.py ]; then
            echo "  creating engine/__init__.py"
            printf 'from .spec import SportSpec\nfrom . import frame, features\n\n__all__ = ["SportSpec", "frame", "features"]\n' > engine/__init__.py
          fi

          missing=""
          for f in $ENGINE_FILES; do
            [ -f "engine/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo ""
            echo "FATAL: these engine files are nowhere in this repo:$missing"
            echo "Upload them into an engine/ folder and re-run."
            exit 1
          fi

          # Compiled bytecode must never be tracked. A .pyc carries the source
          # mtime it was built against; a fresh checkout gives every file a new
          # mtime, so a committed .pyc is invalid on arrival, python rewrites
          # it, and the tree is dirty before anything has run. That is what
          # broke the push on the last run and threw away 20 minutes of HTTP.
          rm -f gitignore
          printf '__pycache__/\n*.pyc\n.env\n\n# Run outputs, not inputs.\nmlb_graded_*.csv\ncfb_depth.csv\ncfb_ready.csv\ncfb_graded.csv\n\n# The history cache IS committed - refetching it costs 20 minutes.\n!data/\n!data/*.csv.gz\n' > .gitignore

          git ls-files | grep '__pycache__' | while read -r f; do
            echo "  untracking $f"
            git rm --cached -q -- "$f"
          done || true
          find . -path ./.git -prune -o -name '__pycache__' -print0 2>/dev/null \
            | xargs -0 rm -rf 2>/dev/null || true

          python -c "import engine, engine.cache, engine.grade; print('engine imports OK')"

      - name: Commit the repair, if there was one
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "repo layout was already correct"
          else
            git commit -m "Engine into a package; stop tracking bytecode"
            git push
          fi

      - name: Fetch
        run: |
          python mlb_fetch.py \
            --seasons "${{ inputs.seasons }}" \
            --refresh "${{ inputs.refresh }}" \
            --limit "${{ inputs.limit }}"

      - name: Commit the cache
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Anything python compiled while fetching is scratch, not a result.
          find . -path ./.git -prune -o -name '__pycache__' -print0 2>/dev/null \
            | xargs -0 rm -rf 2>/dev/null || true

          if [ ! -d data ]; then
            echo "no data directory - nothing was fetched"
            exit 0
          fi

          git add -f data
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "MLB history cache: ${{ inputs.seasons }}"

          echo "--- anything still dirty would block a rebase ---"
          git status --porcelain

          # Push, and only if someone else moved main in the meantime, rebase
          # onto it and try once more. The cache is the expensive artefact of
          # this job; it does not get dropped because of a race.
          if ! git push; then
            echo "push rejected - rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: What is on disk now
        if: always()
        run: ls -la data 2>/dev/null || echo "(no data directory)"
